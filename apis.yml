aid: modak
name: Modak
description: 'Modak (Modak Makers) is a US consumer fintech that offers a family money-management
  app built around a free Visa debit card for kids and teens. Parents can assign chores
  and automate allowance, set savings goals with reward boosts, and use co-parenting
  tools, gift links, ATM access, bill splitting, and spending controls such as instant
  alerts, card freeze, and biometric security. Kids earn MBX reward points through
  daily steps and challenges that convert to pocket money, so they learn to spend,
  save, and manage money in real life. Modak is delivered as a mobile consumer
  application and does not publish a public developer API, SDK, or developer portal.
  Backed by GGV Capital.'
